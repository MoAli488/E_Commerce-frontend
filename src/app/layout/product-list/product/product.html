<a class="product-tile" [routerLink]="'/product-details/' + myProduct.slug">
  <div class="tile-image">
    <img
      [src]="staticURL + myProduct.imageURL"
      [alt]="myProduct.title"
      loading="lazy"
    />
    <span class="tile-action">View details ↗</span>
  </div>
  <div class="tile-info">
    <div class="tile-header">
      <h3>{{ myProduct.title }}</h3>
      <span class="tile-price">${{ myProduct.price }}</span>
    </div>
    <span class="tile-category">{{ myProduct.category?.name || 'Everyday' }}</span>
  </div>
</a>
